<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Exporteller">
  <defs>
    <linearGradient id="g" x1="14" y1="14" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e7dd1"/>
      <stop offset="1" stop-color="#07ebf2"/>
    </linearGradient>
  </defs>
  <!-- Fondo navy de marca -->
  <rect width="64" height="64" rx="14" fill="#262e33"/>
  <!-- Globo (concepto "Linking the world"), estilo isologo -->
  <g fill="none" stroke="url(#g)" stroke-width="3">
    <circle cx="32" cy="32" r="16"/>
    <ellipse cx="32" cy="32" rx="7" ry="16"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
  </g>
  <!-- Nodo de acento (amarillo de marca) -->
  <circle cx="32" cy="32" r="3.4" fill="#ffd957"/>
</svg>
